services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pushdraft
      POSTGRES_PASSWORD: pushdraft
      POSTGRES_USER: pushdraft
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushdraft -d pushdraft"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pushdraft-postgres:/var/lib/postgresql/data

volumes:
  pushdraft-postgres:
