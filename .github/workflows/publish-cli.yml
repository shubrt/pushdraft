name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and release commit
        shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          release_sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$release_sha"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.1.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run qa

      - name: Pack the CLI
        working-directory: apps/cli
        run: |
          version=$(node -p "require('./package.json').version")
          package_dir="$RUNNER_TEMP/pushdraft-release"
          mkdir -p "$package_dir"
          npm pack --pack-destination "$package_dir"
          test -f "$package_dir/pushdraft-$version.tgz"

      - name: Upload the CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pushdraft-cli-package
          path: ${{ runner.temp }}/pushdraft-release/pushdraft-*.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to production
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Deploy the tagged commit
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_SERVICE_ID"
          release_sha=$(git rev-parse "$GITHUB_SHA^{commit}")
          test "$(git rev-parse HEAD)" = "$release_sha"

          deployment_json=$(railway api --compact \
            --raw-var serviceId="$RAILWAY_SERVICE_ID" \
            --raw-var environmentId="$RAILWAY_ENVIRONMENT_ID" \
            --raw-var commitSha="$release_sha" \
            'mutation Deploy($serviceId: String!, $environmentId: String!, $commitSha: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) }')
          deployment_id=$(jq -er '.data.serviceInstanceDeployV2' <<<"$deployment_json")
          echo "Railway deployment: $deployment_id"

          last_status=
          for attempt in {1..240}; do
            if deployment_json=$(railway api --compact \
              --raw-var deploymentId="$deployment_id" \
              'query Deployment($deploymentId: String!) { deployment(id: $deploymentId) { status projectId environmentId serviceId } }'); then
              status=$(jq -er '.data.deployment.status' <<<"$deployment_json")
              project_id=$(jq -er '.data.deployment.projectId' <<<"$deployment_json")
              environment_id=$(jq -er '.data.deployment.environmentId' <<<"$deployment_json")
              service_id=$(jq -er '.data.deployment.serviceId' <<<"$deployment_json")

              test "$project_id" = "$RAILWAY_PROJECT_ID"
              test "$environment_id" = "$RAILWAY_ENVIRONMENT_ID"
              test "$service_id" = "$RAILWAY_SERVICE_ID"

              if [ "$status" != "$last_status" ]; then
                echo "Railway status: $status"
                last_status=$status
              fi

              case "$status" in
                SUCCESS)
                  exit 0
                  ;;
                FAILED | CRASHED | REMOVED | SKIPPED)
                  echo "Railway deployment ended with $status" >&2
                  exit 1
                  ;;
              esac
            fi

            sleep 5
          done

          echo "Timed out waiting for Railway deployment $deployment_id" >&2
          exit 1

      - name: Check production health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 24 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 5 \
            --max-time 10 \
            --output /dev/null \
            https://pushdraft.dev/healthz

  publish:
    name: Publish CLI to npm
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download the CLI package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pushdraft-cli-package
          path: release

      - name: Publish package
        shell: bash
        run: |
          mapfile -t packages < <(find release -maxdepth 1 -type f -name 'pushdraft-*.tgz')
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --ignore-scripts
